name: Arcified extension
on:
  push:
    paths:
      - 'arcified/**'
      - '.github/workflows/arcified-extension.yml'
  pull_request:
    paths:
      - 'arcified/**'
      - '.github/workflows/arcified-extension.yml'

jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: arcified/extension
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - run: bun run check
      - uses: actions/upload-artifact@v4
        with:
          name: arcified-extension-${{ matrix.os }}
          path: arcified/extension/dist
